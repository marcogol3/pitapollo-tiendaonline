<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tienda Pitapollo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Figtree:wght@400;500;600;700&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: app shell mobile-first; sticky header, content column max 1120px, bottom nav on phones, side drawer cart */
:root{
  --bg:#FAF6F4; --surface:#FFFFFF; --sunk:#F3ECE9; --ink:#2B1F1F; --muted:#6F5F5D; --line:#EADCD8;
  --red:#B8141B; --red-ink:#FFFFFF; --red-soft:#FBE9E8; --red-deep:#8F0D13;
  --yellow:#EEE840; --yellow-soft:#FBF8CF; --yellow-ink:#4A4500;
  --good:#1F7A4D; --good-soft:#E3F3EA; --warn:#9A5B00; --warn-soft:#FDF0DC; --bad:#B42318; --bad-soft:#FDE8E6;
  --lcd-bg:#1E2A22; --lcd-ink:#C8F07A;
  --shadow:0 1px 2px rgba(60,20,20,.06),0 6px 20px rgba(60,20,20,.07);
  --f-display:"Fredoka","Baloo 2",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-lcd:"Share Tech Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171212; --surface:#221B1B; --sunk:#2A2222; --ink:#F4ECEA; --muted:#B9AAA7; --line:#3A2F2E;
  --red:#E2464C; --red-ink:#1A0B0B; --red-soft:#3A1E1F; --red-deep:#FF7A7E;
  --yellow:#EEE840; --yellow-soft:#3A3814; --yellow-ink:#F3EE8A;
  --good:#5CC98D; --good-soft:#1C3326; --warn:#F0B35A; --warn-soft:#3A2C16; --bad:#FF7B72; --bad-soft:#3B1D1B;
  --lcd-bg:#101812; --lcd-ink:#C8F07A; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171212; --surface:#221B1B; --sunk:#2A2222; --ink:#F4ECEA; --muted:#B9AAA7; --line:#3A2F2E;
  --red:#E2464C; --red-ink:#1A0B0B; --red-soft:#3A1E1F; --red-deep:#FF7A7E;
  --yellow:#EEE840; --yellow-soft:#3A3814; --yellow-ink:#F3EE8A;
  --good:#5CC98D; --good-soft:#1C3326; --warn:#F0B35A; --warn-soft:#3A2C16; --bad:#FF7B72; --bad-soft:#3B1D1B;
  --lcd-bg:#101812; --lcd-ink:#C8F07A; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--red) 55%,transparent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* prototype ribbon */
.ribbon{background:var(--ink);color:var(--bg);font-size:12.5px}
.ribbon .wrap{display:flex;gap:10px;align-items:center;justify-content:space-between;padding-block:6px;flex-wrap:wrap}
.seg{display:inline-flex;background:color-mix(in srgb,var(--bg) 14%,transparent);border-radius:999px;padding:2px}
.seg button{border:0;background:none;color:inherit;padding:4px 12px;border-radius:999px;font-weight:600;font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink)}

/* service bar */
.service{background:var(--red);color:var(--red-ink);font-size:13px;font-weight:600;text-align:center}
.service .wrap{padding-block:7px;min-height:34px;display:flex;align-items:center;justify-content:center;gap:8px}
.service.mod::after{top:6px!important}
@media (max-width:760px){.notes .service.mod::after{display:none}.ribbon .hide-m{display:none}.service{font-size:12.5px}}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding-block:10px}
.brand{display:flex;align-items:center;gap:6px;border:0;background:none;padding:0}
.brand .head{height:40px;width:auto}
.brand .word{height:30px;width:auto}
.search{position:relative;min-width:0}
.search input{width:100%;border:1.5px solid var(--line);background:var(--sunk);border-radius:999px;padding:10px 14px 10px 40px;font-size:15px}
.search input:focus{border-color:var(--red);background:var(--surface);outline:none}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.hdr-actions{display:flex;gap:8px;align-items:center}
.zone-btn{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;font-size:13.5px;font-weight:600;max-width:210px}
.zone-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cart-btn{display:flex;align-items:center;gap:8px;border:0;background:var(--red);color:var(--red-ink);border-radius:999px;padding:9px 14px;font-weight:700}
.cart-btn .count{background:var(--yellow);color:#3a3600;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12.5px;padding:0 6px}
.cart-btn svg,.zone-btn svg{width:18px;height:18px;flex:none}
.catnav{border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.catnav::-webkit-scrollbar{display:none}
.catnav .wrap{display:flex;gap:4px;padding-block:6px;white-space:nowrap}
.catnav button{border:0;background:none;padding:7px 12px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.catnav button:hover{color:var(--ink);background:var(--sunk)}
.catnav button[aria-current="true"]{color:var(--red);background:var(--red-soft)}
@media (max-width:760px){
  .top .wrap{grid-template-columns:auto 1fr;row-gap:10px}
  .search{grid-column:1/-1;order:3}
  .brand .word{height:26px}.brand .head{height:34px}
  .zone-btn{max-width:150px;padding:7px 10px}
  .cart-btn .lbl{display:none}
  .catnav{display:none}
}

main{padding-block:18px 110px;min-height:60vh}
section{margin-block:0 34px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec-head h2{font-size:22px}
.link{border:0;background:none;color:var(--red);font-weight:700;padding:4px 0}

/* editable module tag */
.mod{position:relative}
.notes .mod::after{content:attr(data-mod);position:absolute;top:-10px;right:8px;background:var(--yellow);color:#3a3600;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:999px;pointer-events:none;z-index:2}

/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:24px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px;overflow:hidden}
.hero h1{font-size:clamp(30px,4.6vw,46px);letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--red)}
.hero p{font-size:17px;color:var(--muted);max-width:46ch;margin:12px 0 20px}
.cta-row{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:12px 20px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--red);color:var(--red-ink)}
.btn svg{width:18px;height:18px;flex:none}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{background:var(--sunk);color:var(--ink);border:1.5px solid var(--line)}
.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.hero-art{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:240px;padding-block:8px}
.hero-art .blob{position:absolute;inset:8% 4%;background:var(--red-soft);border-radius:44% 56% 52% 48%/50% 44% 56% 50%}
.hero-art .logo{position:relative;width:min(230px,70%);height:auto;filter:drop-shadow(0 8px 18px rgba(120,20,20,.15))}
.ticket{position:relative;margin-top:-14px;align-self:flex-end;margin-right:4%;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px;width:190px}
.ticket small{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-top:6px}
.lcd{background:var(--lcd-bg);color:var(--lcd-ink);font-family:var(--f-lcd);border-radius:8px;padding:8px 10px;display:flex;justify-content:space-between;align-items:baseline;letter-spacing:.04em}
.lcd b{font-size:24px;font-weight:400}
.lcd span{font-size:12px;opacity:.8}
@media (max-width:760px){.hero{grid-template-columns:1fr;padding:22px}.hero-art{min-height:0;order:-1}.hero-art .logo{width:170px}.ticket{width:170px;margin-right:0}}

/* categories */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.cat{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 2px;font-weight:600;font-size:14px;text-align:center}
.cat .ic{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1.5px solid var(--line);color:var(--red);transition:transform .15s}
.cat:hover .ic{transform:translateY(-2px);border-color:var(--red)}
.cat .ic svg{width:36px;height:36px}
.cat.promo .ic{background:var(--yellow-soft);color:var(--yellow-ink);border-color:color-mix(in srgb,var(--yellow) 60%,var(--line))}

/* value props */
.values{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.value{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.value svg{width:28px;height:28px;color:var(--red)}
.value h3{font-size:16px;margin:10px 0 4px}
.value p{margin:0;font-size:13.5px;color:var(--muted)}
@media (max-width:900px){.values{grid-template-columns:repeat(2,1fr)}}

/* product grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
@media (max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card .ph svg{width:56px;height:56px}.price b{font-size:15.5px}}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(180px,200px);gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.rail>*{scroll-snap-align:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card .ph{aspect-ratio:4/3;display:grid;place-items:center;position:relative;border:0;width:100%;padding:0}
.card .ph svg{width:72px;height:72px;opacity:.9}
.card:not(article) .ph svg{width:34px;height:34px}
.ph.t-pollo,.ph.t-premier{background:#FDF1E4;color:#B25A12}
.ph.t-carnes{background:#FBE7E6;color:#A3232A}
.ph.t-cerdo{background:#FCE9EF;color:#B03B62}
.ph.t-charcuteria{background:#FCF3DC;color:#946100}
.ph.t-congelados{background:#E6F1FA;color:#2D6A9A}
.ph.t-pasapalos{background:#FFF1DA;color:#A45C00}
.ph.t-viveres{background:#EAF4E4;color:#3D7A2E}
.ph.t-mayor{background:#ECEAF6;color:#4B4592}
:root[data-theme="dark"] .ph{background:color-mix(in srgb,currentColor 18%,var(--surface))!important}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ph{background:color-mix(in srgb,currentColor 18%,var(--surface))!important}}
.badges{position:absolute;top:8px;left:8px;display:flex;gap:4px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface);color:var(--ink);letter-spacing:.02em}
.badge.mayor{background:var(--yellow);color:#3a3600}
.badge.premier{background:#2B1F1F;color:#F6E7B0}
.badge.soon{background:var(--sunk);color:var(--muted)}
.card .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .name{font-weight:600;font-size:14.5px;line-height:1.3;border:0;background:none;padding:0;text-align:left;min-height:2.6em}
.card .unit{font-size:12px;color:var(--muted);font-weight:600}
.card .foot{display:flex;align-items:end;justify-content:space-between;gap:8px;margin-top:auto}
.price b{font-size:17px;font-weight:700}
.price small{display:block;font-size:12px;color:var(--muted)}
.add{width:40px;height:40px;border-radius:50%;border:0;background:var(--red);color:var(--red-ink);display:grid;place-items:center;flex:none}
.add svg{width:20px;height:20px}
.add:disabled{background:var(--sunk);color:var(--muted)}

/* listing */
.list-head{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between;margin-bottom:14px}
.list-head h1{font-size:28px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:13.5px}
.chip[aria-pressed="true"]{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:18px;margin-bottom:6px}

/* how it works, b2b, trust */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;counter-reset:s}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 16px 58px;position:relative}
.step::before{counter-increment:s;content:counter(s);position:absolute;left:16px;top:16px;width:30px;height:30px;border-radius:50%;background:var(--red);color:var(--red-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:600}
.step h3{font-size:16px}.step p{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
@media (max-width:760px){.steps{grid-template-columns:1fr}}
.b2b{display:flex;gap:20px;align-items:center;justify-content:space-between;background:var(--ink);color:var(--bg);border-radius:22px;padding:24px 26px;flex-wrap:wrap}
.b2b h2{font-size:24px}.b2b p{margin:6px 0 0;opacity:.8;max-width:52ch}
.b2b .btn{background:var(--yellow);color:#3a3600}
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.trust div{border-left:3px solid var(--red);padding:4px 0 4px 12px}
.trust b{display:block;font-family:var(--f-display);font-size:17px;font-weight:600}
.trust span{font-size:13.5px;color:var(--muted)}
@media (max-width:760px){.trust{grid-template-columns:repeat(2,1fr)}}

/* fotos de producto */
.ph{position:relative;overflow:hidden}
.ph .pimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:inherit}
.ph .badges{z-index:1}
.ph .badge{box-shadow:0 1px 3px rgba(0,0,0,.18)}
@media (min-width:761px){.sheet .pd .ph{aspect-ratio:4/3}}
.foto-ref{font-size:12px;color:var(--muted);margin-top:-8px}
.cov{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.cov i{display:block;height:100%;background:var(--good)}
/* pesaje */
.wrow{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:6px 14px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.wrow b{display:block;font-size:14.5px}
.wrow .meta{font-size:12.5px;color:var(--muted)}
.wrow .win{display:flex;gap:6px;align-items:center}
.wrow .win input{width:100%;text-align:right;font-size:18px;font-weight:700;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:8px 10px}
.wrow .win input:focus{border-color:var(--red);outline:none}
.wrow .sub{grid-column:1/-1;display:flex;justify-content:space-between;gap:10px;font-size:13px}
.wwarn{color:var(--warn);font-weight:600}
.wphoto{width:100%;max-height:260px;object-fit:cover;border-radius:12px}
@media (max-width:520px){.wrow{grid-template-columns:1fr}}
/* mapa de sedes */
:root{--s-bv:#B8141B;--s-al:#B86A00;--s-lt:#1F7A4D}
:root[data-theme="dark"]{--s-bv:#FF7A7E;--s-al:#F0B35A;--s-lt:#5CC98D}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s-bv:#FF7A7E;--s-al:#F0B35A;--s-lt:#5CC98D}}
.mapa{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;align-items:center}
.mapa svg{width:100%;height:auto;display:block}
.mapa .muni{stroke:var(--surface);stroke-width:3;stroke-linejoin:round}
.mapa .mlbl{font:600 13px var(--f-body);fill:var(--ink)}
.mapa .plbl{font:700 12.5px var(--f-body);fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.mapa .avila{font:600 11px var(--f-body);fill:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.sedes-lst{display:grid;gap:10px}
.sedes-lst div{border-left:4px solid var(--c);padding:6px 0 6px 12px}
.sedes-lst b{display:block;font-family:var(--f-display);font-size:17px;font-weight:600}
.sedes-lst span{font-size:13.5px;color:var(--muted)}
@media (max-width:760px){.mapa{grid-template-columns:1fr;padding:14px}}

/* footer */
footer{background:var(--surface);border-top:1px solid var(--line);padding-block:28px 120px;font-size:14px}
.fgrid{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:22px}
.fgrid h4{font-family:var(--f-display);font-weight:600;font-size:15px;margin:0 0 8px}
.fgrid ul{list-style:none;margin:0;padding:0;display:grid;gap:4px;color:var(--muted)}
.legal{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:13px}
.legal b{color:var(--ink)}
@media (max-width:760px){.fgrid{grid-template-columns:1fr 1fr}}

/* bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);display:none}
.bnav .row{display:grid;grid-template-columns:repeat(5,1fr)}
.bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;font-size:11.5px;font-weight:600;color:var(--muted);position:relative}
.bnav button svg{width:22px;height:22px}
.bnav button[aria-current="true"]{color:var(--red)}
.bnav .dot{position:absolute;top:4px;left:calc(50% + 6px);background:var(--red);color:var(--red-ink);font-size:10.5px;border-radius:999px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
@media (max-width:760px){.bnav{display:block}}
.wa{position:fixed;right:16px;bottom:24px;z-index:34;border:0;background:#1F9D55;color:#fff;border-radius:999px;padding:12px 16px;display:flex;gap:8px;align-items:center;font-weight:700;box-shadow:var(--shadow)}
.wa svg{width:20px;height:20px}
@media (max-width:760px){.wa{bottom:78px;padding:12px}.wa .lbl{display:none}}

/* overlay: sheet + drawer */
.scrim{position:fixed;inset:0;background:rgba(20,8,8,.45);z-index:50;display:flex}
.sheet{margin:auto;background:var(--surface);width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:22px;box-shadow:var(--shadow)}
.drawer{margin-left:auto;background:var(--surface);width:min(420px,100%);height:100%;display:flex;flex-direction:column}
@media (max-width:760px){.scrim{align-items:flex-end}.sheet{margin:0;border-radius:22px 22px 0 0;max-height:94vh}}
.x{border:0;background:var(--sunk);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.x svg{width:18px;height:18px}
.pd{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:0}
.pd .ph{aspect-ratio:1;display:grid;place-items:center;border-radius:22px 0 0 0}
.pd .ph svg{width:120px;height:120px}
.pd .ph{align-self:start}
.pd .info{padding:20px 22px 0;display:flex;flex-direction:column;gap:14px;min-width:0}
.pd .top-row{display:flex;justify-content:space-between;gap:12px;align-items:start}
.pd h2{font-size:24px}
.pd .perkg{font-size:15px;color:var(--muted)}
.pd .perkg b{color:var(--ink);font-size:20px}
@media (max-width:760px){.pd{grid-template-columns:minmax(0,1fr)}.pd .ph{aspect-ratio:16/7;border-radius:22px 22px 0 0}.pd .ph svg{width:80px;height:80px}}
.label{font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.pres{display:grid;gap:8px}
.pres label{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;cursor:pointer}
.pres label:has(input:checked){border-color:var(--red);background:var(--red-soft)}
.pres input{accent-color:var(--red);width:18px;height:18px}
.pres .t{flex:1;min-width:0}
.pres .t b{display:block;font-size:14.5px}
.pres .t span{font-size:12.5px;color:var(--muted)}
.pres .p{text-align:right;font-size:13px;color:var(--muted)}
.pres .p b{display:block;color:var(--ink);font-size:15px}
.save{font-size:12.5px;font-weight:700;color:var(--good);background:var(--good-soft);padding:6px 10px;border-radius:8px}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.qty button{border:0;background:none;width:40px;height:38px;display:grid;place-items:center}
.qty button svg{width:16px;height:16px}
.qty output{min-width:52px;text-align:center;font-weight:700}
.kgs{display:flex;gap:8px;flex-wrap:wrap}
.field{display:grid;gap:5px}
.field label{font-size:13.5px;font-weight:600}
.field input,.field select,.field textarea{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:10px 12px;width:100%;min-width:0}
.field textarea{resize:vertical;min-height:60px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--red);outline:none}
.field .err{color:var(--bad);font-size:12.5px}
.seal{display:flex;gap:10px;align-items:center;background:var(--sunk);border-radius:var(--r-sm);padding:10px 12px;font-size:13px}
.seal svg{width:26px;height:26px;color:var(--red);flex:none}
.seal b{display:block;font-size:13.5px}
.sticky-cta{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 22px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:6px}
.sticky-cta .est{font-size:12.5px;color:var(--muted)}
.sticky-cta .est b{display:block;font-size:17px;color:var(--ink)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13.5px}
.facts div{background:var(--sunk);border-radius:var(--r-sm);padding:10px 12px}
.facts b{display:block;font-size:13px}

/* drawer cart */
.dr-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.dr-head h2{font-size:20px}
.dr-body{flex:1;overflow:auto;padding:14px 18px;display:grid;gap:12px;align-content:start}
.line{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:start;padding-bottom:12px;border-bottom:1px solid var(--line)}
.line .mini{width:48px;height:48px;border-radius:10px;display:grid;place-items:center}
.line .mini svg{width:26px;height:26px}
.line b{font-size:14px;display:block;line-height:1.3}
.line .meta{font-size:12.5px;color:var(--muted)}
.line .amt{text-align:right;font-size:14px;font-weight:700}
.line .rm{border:0;background:none;color:var(--muted);font-size:12.5px;padding:2px 0;text-decoration:underline}
.progress{background:var(--sunk);border-radius:var(--r-sm);padding:10px 12px;font-size:13px}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--good);border-radius:999px}
.dr-foot{border-top:1px solid var(--line);padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:10px}
.sum{display:grid;gap:4px;font-size:14px}
.sum div{display:flex;justify-content:space-between;gap:10px}
.sum .tot{font-size:16px;font-weight:700;padding-top:6px;border-top:1px dashed var(--line);margin-top:4px}
.note{font-size:12.5px;color:var(--muted)}

/* checkout */
.co{display:grid;grid-template-columns:1.35fr .9fr;gap:18px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:14px;min-width:0}
.panel h2{font-size:19px;display:flex;align-items:center;gap:10px}
.panel h2 .n{width:28px;height:28px;border-radius:50%;background:var(--red);color:var(--red-ink);font-size:14px;display:grid;place-items:center;flex:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:860px){.co{grid-template-columns:1fr}.two{grid-template-columns:1fr}.aside{position:static}}
.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;align-items:start}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.slot{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:10px;font-weight:600;font-size:13.5px}
.slot[aria-pressed="true"]{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.methods{display:grid;gap:8px}
.aside{position:sticky;top:120px}

/* order tracking */
.track{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0 2px}
.track div{font-size:12px;font-weight:600;color:var(--muted);text-align:center;display:grid;gap:6px;justify-items:center}
.track i{display:block;height:6px;width:100%;border-radius:999px;background:var(--line)}
.track .on{color:var(--ink)}.track .on i{background:var(--red)}
.state{border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:start}
.state svg{width:24px;height:24px;flex:none;margin-top:2px}
.state b{display:block;font-size:15.5px}
.state.info{background:var(--sunk)}.state.good{background:var(--good-soft);color:var(--good)}.state.warn{background:var(--warn-soft);color:var(--warn)}.state.bad{background:var(--bad-soft);color:var(--bad)}
.state.good b,.state.warn b,.state.bad b{color:inherit}
.state p{margin:2px 0 0;font-size:13.5px;color:var(--ink)}
.demo{border:1.5px dashed color-mix(in srgb,var(--yellow) 70%,var(--line));background:var(--yellow-soft);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13.5px}
.demo b{color:var(--yellow-ink)}
.demo .btn{padding:9px 16px;font-size:14px;background:var(--ink);color:var(--bg)}
.scale{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--sunk);border-radius:var(--r);padding:12px}
.scale .photo{width:150px;background:linear-gradient(160deg,#9aa3a8,#6c757a);border-radius:12px;padding:12px 10px;display:grid;gap:8px}
.scale .photo .lcd b{font-size:20px}
.scale .photo small{color:#eef;font-size:10.5px;text-align:center;font-weight:600;letter-spacing:.04em}
.weights{display:grid;gap:4px;font-size:13.5px}
.weights div{display:flex;justify-content:space-between;gap:8px}
.pay-data{display:grid;gap:6px;background:var(--sunk);border-radius:var(--r-sm);padding:12px}
.pay-data div{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.copy{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:700;display:inline-flex;gap:4px;align-items:center}
.copy svg{width:14px;height:14px}
.drop{border:1.5px dashed var(--line);border-radius:var(--r-sm);padding:14px;text-align:center;font-size:13.5px;color:var(--muted);display:grid;gap:8px;justify-items:center;cursor:pointer}
.drop img{max-height:140px;border-radius:8px}
.receipt{font-size:13.5px;display:grid;gap:6px}
.receipt .hd{display:flex;justify-content:space-between;gap:10px;align-items:start;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.receipt .hd b{font-family:var(--f-display);font-size:15px;font-weight:600}

/* admin */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.queue{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.qcard .shot{height:150px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:13px}
.qcard .shot img{width:100%;height:100%;object-fit:cover}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-weight:600}
.flag{font-size:12.5px;font-weight:700;padding:6px 10px;border-radius:8px}
.flag.ok{background:var(--good-soft);color:var(--good)}.flag.no{background:var(--bad-soft);color:var(--bad)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:640px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sunk)}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.red{background:var(--red-soft);color:var(--red)}
.sbtn{border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet,.drawer{animation:up .22s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
</style>

function lineEst(l){const p=P[l.id];

  const v=l.kg*p.price;return {min:v*.97,max:v*1.03}}
function lineLabel(l){const p=P[l.id];
  if(p.unit==="unidad")return `${l.qty} × ${usd(p.price)}`;
  if(l.pres!=null){const r=p.pres[l.pres];return `${l.qty} × ${r.label} · ${r.note} · ${usd(r.price)}/kg`}
  return `${kgShort(l.kg)} aprox. · ${usd(p.price)}/kg`}

/* ---------- order ---------- */
const TRACK=[["recibido","Recibido"],["pesado","Pesado"],["confirmado","Pago confirmado"],["camino","En camino"],["entregado","Entregado"]];
const ORDER_IDX={recibido:0,pesado:1,revision:1,confirmado:2,camino:3,entregado:4,vencido:1};
function vOrder(){const o=S.orders.find(x=>x.num===S.order);if(!o)return vOrders();const idx=ORDER_IDX[o.status];
  let body="";
  if(o.status==="recibido")body=`<div class="state info">${svg(I.scale)}<div><b>Estamos pesando tu pedido</b><p>Te enviaremos por WhatsApp la foto de la balanza y el total exacto. Luego tendrás 30 minutos para pagar.</p></div></div>
   ${demo("La tienda pesa el pedido en su panel y te envía la foto.","Ir al panel a pesar",`weigh`,o.num)}`;
  if(o.status==="pesado"||o.status==="revision"||o.status==="vencido")body=scaleBlock(o);
  if(o.status==="pesado")body+=payBlock(o);
  if(o.status==="revision")body+=`<div class="state warn">${svg(I.clock)}<div><b>Pago en revisión</b><p>Recibimos tu comprobante (ref. ${esc(o.pago.ref)}). Te confirmamos por WhatsApp en cuanto lo verifiquemos.</p></div></div>
   ${demo("El administrador verifica el pago en el panel.","Ir al panel",`panel`,o.num)}`;
  if(o.status==="vencido")body+=`<div class="state bad">${svg(I.alert)}<div><b>El tiempo para pagar venció</b><p>La mercancía volvió al inventario. Puedes repetir el pedido cuando quieras.</p></div></div>`;
  if(o.status==="confirmado")body=`<div class="state good">${svg(I.check,2.2)}<div><b>Pago confirmado</b><p>${o.pago&&o.pago.contra?"Pagarás al recibir.":"Gracias. "}Estamos preparando el despacho para ${esc(o.dayLbl.toLowerCase())}, ${esc(o.slot)}.</p></div></div>${demo("La tienda asigna un motorizado.","Enviar con motorizado","ship",o.num)}`;
  if(o.status==="camino")body=`<div class="state good">${svg(I.truck)}<div><b>Tu pedido va en camino</b><p>El motorizado va hacia ${esc(o.urb)}. Si no hay nadie, te llamará por WhatsApp antes de irse.</p></div></div>${demo("El cliente recibe el pedido.","Marcar entregado","deliver",o.num)}`;
  if(o.status==="entregado")body=`<div class="state good">${svg(I.check,2.2)}<div><b>¡Entregado! Buen provecho</b><p>Si al pesar en casa hay una diferencia mayor al 1%, escríbenos y queda como saldo a favor.</p></div></div>
   <div class="cta-row"><button class="btn btn-primary" data-repeat="${o.num}">Repetir este pedido</button><button class="btn btn-ghost" data-toast="Enlace de invitación listo para compartir">Invitar a un amigo</button></div>`;
  if(o.rechazo&&o.status==="pesado")body=`<div class="state bad">${svg(I.alert)}<div><b>No pudimos confirmar tu pago</b><p>Motivo: ${esc(o.rechazo)}. Revisa los datos y envíalo de nuevo.</p></div></div>`+body;
  return `<div class="list-head"><div><button class="link" data-go="orders">${svg(I.back,2).replace('<svg','<svg style="width:14px;height:14px;vertical-align:-2px"')} Mis pedidos</button><h1>Pedido ${o.num}</h1><div class="muted">${esc(o.dayLbl)} · ${esc(o.slot)} · ${esc(o.urb)}, ${esc(o.zona)}</div></div>${pill(o)}</div>
  <div class="co"><div style="display:grid;gap:14px;min-width:0"><div class="panel">
   <div class="track">${TRACK.map(([k,l],i)=>`<div class="${i<=idx&&o.status!=="vencido"?"on":""}"><i></i>${l}</div>`).join("")}</div>${body}</div></div>
   <div class="panel aside">${receipt(o)}</div></div>`}
function demo(txt,btn,act,num){return `<div class="demo"><span><b>Demostración:</b> ${txt}</span><button class="btn" data-demo="${act}" data-num="${num}">${btn}</button></div>`}
function scaleBlock(o){const w=o.lines.filter(l=>l.w!=null);if(!w.length)return `<div class="state info">${svg(I.receipt)}<div><b>Total exacto listo</b><p>Tu pedido solo tiene productos por unidad, así que no requiere pesado.</p></div></div>`;
  const tot=w.reduce((a,l)=>a+l.w,0);
  return `<div class="scale">${o.scalePhoto?`<div><img class="wphoto" style="width:170px;height:170px" src="${o.scalePhoto}" alt="Foto de la balanza"><small class="note">Foto de la balanza · ${o.pesadoHora}</small></div>`:`<div class="photo" role="img" aria-label="Pesos: ${kg(tot)}"><div class="lcd num"><b>${nf3.format(tot)}</b><span>kg</span></div><small>PESO TOTAL · ${o.pesadoHora}</small></div>`}
   <div class="weights num"><b style="font-size:14.5px">Peso real por producto</b>${w.map(l=>`<div><span>${esc(P[l.id].name)}</span><span>${kg(l.w)}</span></div>`).join("")}<span class="note">Balanza certificada por SENCAMER · registro en cámara disponible</span></div></div>`}
function payBlock(o){const m=METODOS.find(x=>x.id===o.metodo);const p=o.payDraft||(o.payDraft={});
  return `<div class="state warn">${svg(I.clock)}<div><b>Paga antes de las ${o.pagarAntes}</b><p>Total exacto: <b class="num" style="display:inline">${usd(o.total)}</b> · <span class="num">${bs(o.total)}</span> (tasa BCV ${nf2.format(S.tasa)}). Si no se paga a tiempo, la mercancía vuelve a inventario.</p></div></div>
  <div><div class="label">Método de pago</div><div class="chips">${METODOS.map(x=>`<button class="chip" data-paymethod="${x.id}" data-num="${o.num}" aria-pressed="${o.metodo===x.id}">${x.name}</button>`).join("")}</div></div>
  ${m.comp?`<div class="pay-data"><div><span class="muted">Monto a pagar</span><b class="num">${m.mon==="Bs"?bs(o.total):usd(o.total)}</b></div>${payDatos(m,o).map(([k,v])=>`<div><span class="muted">${k}</span><span style="display:flex;gap:8px;align-items:center"><b>${esc(v)}</b>${v.startsWith("Por")||k==="Sede"?"":`<button class="copy" data-copy="${esc(k==="Teléfono"||k==="RIF"?v.replace(/-/g,""):v)}">${svg(I.copy,2)}Copiar</button>`}</span></div>`).join("")}</div>
  <form class="panel" style="padding:0;border:0" id="payForm" data-num="${o.num}" novalidate>
   <div class="two"><div class="field"><label for="p-ref">Número de referencia</label><input id="p-ref" name="ref" inputmode="numeric" value="${esc(p.ref||"")}" placeholder="Últimos 6 dígitos">${S.errors.ref?`<span class="err">${S.errors.ref}</span>`:""}</div>
    <div class="field"><label for="p-banco">${m.id==="ze"?"Correo o titular de origen":"Banco de origen"}</label><input id="p-banco" name="banco" value="${esc(p.banco||"")}"></div></div>
   <label class="drop" for="p-file">${p.img?`<img src="${p.img}" alt="Captura del pago">Cambiar captura`:`${svg(I.camera).replace('<svg','<svg style="width:28px;height:28px"')}<span><b>Sube la captura del pago</b><br>Se comprime antes de enviarse para ahorrar datos</span>`}</label>
   <input id="p-file" type="file" accept="image/*" class="sr" data-num="${o.num}">
   <button class="btn btn-primary btn-block" type="submit">Enviar comprobante</button></form>`
  :`<div class="pay-data"><div><span class="muted">Pagarás al recibir</span><b class="num">${m.mon==="Bs"?bs(o.total):usd(o.total)}</b></div></div><button class="btn btn-primary btn-block" data-contra="${o.num}">Confirmar pago al recibir</button>`}`}
function receipt(o){return `<div class="receipt num"><div class="hd"><div><b>${esc(EMPRESA.razon)}</b><div class="note">RIF ${EMPRESA.rif}</div></div><img src="${HEAD}" alt="" style="width:34px;height:auto"></div>
  ${o.lines.map(l=>`<div style="display:flex;justify-content:space-between;gap:10px"><span>${esc(P[l.id].name)}<br><span class="note">${l.w!=null?kg(l.w)+" × "+usd(l.pk)+"/kg":lineLabel(l)}</span></span><span>${l.sub!=null?bs(l.sub):rangeBs(l.e.min,l.e.max)}</span></div>`).join("")}
  <div class="sum" style="border-top:1px solid var(--line);padding-top:6px">
   <div><span>Productos</span><span>${o.exact!=null?bs(o.exact):rangeBs(o.est.min,o.est.max)}</span></div><div><span>Envío · ${esc(o.zona)}</span><span>${bs(o.fee)}</span></div>
   <div class="tot"><span>${o.exact!=null?"Total en bolívares":"Total aproximado en Bs"}</span><span>${o.exact!=null?bs(o.total):rangeBs(o.est.min+o.fee,o.est.max+o.fee)}</span></div>
   <div class="tot" style="border-top:0;margin-top:0;padding-top:0"><span>Total en divisas</span><span>${o.exact!=null?usd(o.total):range(o.est.min+o.fee,o.est.max+o.fee)}</span></div>
   <div><span class="note">Total en Bs ÷ tasa BCV ${nf2.format(S.tasa)}</span></div></div>
  <div class="note">Cliente: ${esc(o.nom)} · ${esc(o.tel)}${o.sede?" · Despacha "+esc(o.sede):""}</div></div>`}

   <div>${pill(o)}</div>
   <dl class="kv"><dt>Cliente</dt><dd>${esc(o.nom)}</dd><dt>Teléfono / WhatsApp</dt><dd>${esc(o.tel)}</dd><dt>Correo</dt><dd>${esc(o.mail||"—")}</dd>
    <dt>Dirección</dt><dd style="white-space:normal">${esc(o.dir||"—")}</dd><dt>Referencia</dt><dd style="white-space:normal">${esc(o.ref||"—")}</dd><dt>Zona</dt><dd>${esc(o.urb)}, ${esc(o.zona)}</dd>
    <dt>Recibe</dt><dd>${o.recibe==="otra"?"Otra persona":"El cliente"}</dd><dt>Franja</dt><dd>${esc(o.dayLbl)} ${esc(o.slot)}</dd><dt>Sede que despacha</dt><dd>${esc(o.sede||"—")}</dd><dt>Forma de pago</dt><dd>${m?m.name:"—"}</dd></dl>
   ${o.lines.some(l=>l.sust&&l.sust!=="similar")?`<div class="note">Sustitución: ${o.lines.filter(l=>l.sust&&l.sust!=="similar").map(l=>esc(P[l.id].name)+" · "+(l.sust==="llamar"?"llamar antes":"no reemplazar")).join("; ")}</div>`:""}</div>
   <div class="panel"><h2>Lo que pidió</h2>${receipt(o)}${o.exact!=null?`${o.scalePhoto?`<div><div class="label">Foto de la balanza</div><img class="wphoto" src="${o.scalePhoto}" alt="Foto de la balanza"></div>`:""}<a class="btn btn-primary" style="text-decoration:none" href="${waCliente(o)}" target="_blank" rel="noopener">Avisar al cliente por WhatsApp</a><div class="note">El mensaje sale con los pesos y el total. Adjunta la foto de la balanza en el chat.</div>`:""}</div></div>`}
function vAdmin(){const tabs=[["pagos","Pagos por conciliar"],["pedidos","Pedidos"],["fotos","Fotos"],["ajustes","Ajustes"]];

  let body="";
  if(S.adminTab==="pagos")body=q.length?`<div class="queue">${q.map(o=>{const dup=S.orders.some(x=>x!==o&&x.pago&&x.pago.ref===o.pago.ref);const m=METODOS.find(x=>x.id===o.metodo);

     <div class="shot">${o.pago.img?`<img src="${o.pago.img}" alt="Captura enviada por el cliente">`:"El cliente no adjuntó captura"}</div>
     <dl class="kv num"><dt>Monto esperado</dt><dd>${m.mon==="Bs"?bs(o.total):usd(o.total)}</dd><dt>Referencia</dt><dd>${esc(o.pago.ref)}</dd><dt>Origen</dt><dd>${esc(o.pago.banco||"—")}</dd><dt>Cliente</dt><dd>${esc(o.nom)}</dd><dt>Recibido</dt><dd>${o.pago.hora}</dd></dl>
     <div class="flag ${dup?"no":"ok"}">${dup?"Referencia repetida en otro pago":"Referencia no usada antes"}</div>
     <div class="field"><label for="mot-${o.num}">Motivo si se rechaza</label><select id="mot-${o.num}"><option>Monto incompleto</option><option>Referencia no encontrada</option><option>Captura ilegible</option><option>Otro</option></select></div>
     <div class="cta-row"><button class="btn btn-primary" data-approve="${o.num}">${svg(I.check,2.2).replace('<svg','<svg style="width:18px;height:18px"')}Aprobar</button><button class="btn btn-ghost" data-reject="${o.num}">Rechazar</button></div></div>`}).join("")}</div>`
    :`<div class="empty"><h3>No hay pagos por conciliar</h3>Cuando un cliente envíe su comprobante, aparecerá aquí con la captura y las validaciones.</div>`;
  if(S.adminTab==="pedidos"){const sf=S.sedeF||"todas";const list=S.orders.filter(o=>sf==="todas"||o.sede===sf);const det=S.orders.find(o=>o.num===S.adminOrder);
   body=S.orders.length?`<div class="chips" style="margin-bottom:12px">${["todas",...EMPRESA.sedes].map(x=>`<button class="chip" data-sedef="${x}" aria-pressed="${sf===x}">${x==="todas"?"Todas las sedes":esc(x)}</button>`).join("")}</div>
    ${S.weighing&&S.orders.find(x=>x.num===S.weighing)?vPesaje(S.orders.find(x=>x.num===S.weighing)):""}${det?vPedidoDet(det):""}<div class="tbl-wrap"><table><thead><tr><th>Pedido</th><th>Cliente</th><th>Zona</th><th>Sede</th><th>Franja</th><th>Total</th><th>Estado</th><th>Acción</th></tr></thead><tbody>
    ${list.map(o=>{const act={recibido:["weigh","Pesar y enviar foto"],confirmado:["ship","Asignar motorizado"],camino:["deliver","Marcar entregado"]}[o.status];
    return `<tr><td><button class="link" data-verped="${o.num}">${o.num}</button></td><td>${esc(o.nom)}<br><span class="muted" style="font-size:12.5px">${esc(o.tel)}</span></td><td>${esc(o.urb)}, ${esc(o.zona)}</td><td>${esc(o.sede||"—")}</td><td>${esc(o.dayLbl)} ${esc(o.slot)}</td><td class="num">${o.exact!=null?usd(o.total):range(o.est.min+o.fee,o.est.max+o.fee)}</td><td>${pill(o)}</td><td>${act?`<button class="sbtn" data-demo="${act[0]}" data-num="${o.num}" data-stay>${act[1]}</button>`:o.status==="revision"?`<button class="sbtn" data-tab="pagos">Conciliar</button>`:""}</td></tr>`}).join("")}</tbody></table></div>${list.length?`<div class="note" style="margin-top:8px">Toca el número de pedido para ver los datos del cliente y lo que pidió.</div>`:`<div class="note" style="margin-top:8px">Esta sede no tiene pedidos.</div>`}`
    :`<div class="empty"><h3>Aún no hay pedidos</h3>Cambia a la vista de cliente y haz un pedido de prueba.</div>`}
  if(S.adminTab==="fotos"){const tot=CATALOG.length,con=CATALOG.filter(photoOf).length;
   const faltan=CATALOG.filter(x=>!photoOf(x));
   body=`<div class="panel" style="margin-bottom:14px"><h2>Fotos de productos</h2><div class="num"><b style="font-size:22px">${con}</b> de ${tot} productos con foto</div><div class="cov"><i style="width:${tot?con/tot*100:0}%"></i></div>
    <div class="note">Cada foto se asocia por el código del producto: el archivo <b>10001.jpg</b> es la foto del código 10001. Sin foto, la tienda muestra el ícono de su línea.</div></div>
    <div class="admin-grid">${CATS.map(c=>{const ps=CATALOG.filter(x=>x.cat===c.id),f=ps.filter(photoOf).length;
     return `<div class="panel"><h2>${esc(c.name)}</h2><div class="num muted">${f} de ${ps.length} con foto</div><div class="cov"><i style="width:${ps.length?f/ps.length*100:0}%"></i></div>
     <details><summary class="note" style="cursor:pointer">Ver códigos sin foto (${ps.length-f})</summary><div class="note num" style="margin-top:6px;display:grid;gap:2px">${ps.filter(x=>!photoOf(x)).map(x=>`<span>${x.id} · ${esc(x.name)}</span>`).join("")||"Todos tienen foto"}</div></details></div>`}).join("")}</div>`}
  if(S.adminTab==="ajustes")body=`<div class="admin-grid"><div class="panel"><h2>Tasa BCV del día</h2>
    <div><div class="label">Cómo se actualiza</div><div class="chips"><button class="chip" data-tasamode="auto" aria-pressed="${S.tasaAuto}">Automática</button><button class="chip" data-tasamode="manual" aria-pressed="${!S.tasaAuto}">Manual</button></div></div>
    <dl class="kv num"><dt>Tasa activa</dt><dd>Bs ${nf2.format(S.tasa)}</dd><dt>Última actualización</dt><dd>${S.tasaFecha}${S.tasaHora?" · "+S.tasaHora:""}</dd><dt>Origen</dt><dd>${S.tasaFuente==="auto"?"Automática (BCV)":"Manual"}</dd>${S.tasaAuto?`<dt>Próxima actualización</dt><dd>Mañana · 6:00 am</dd>`:""}</dl>
    <div class="field"><label for="a-tasa">${S.tasaAuto?"Corrección manual (respaldo)":"Bs por USD"}</label><input id="a-tasa" inputmode="decimal" value="${nf2.format(S.tasa)}"></div>
    <div class="note">${S.tasaAuto?"Cada mañana la tienda toma la tasa publicada por el BCV. Si la actualización falla, se mantiene la última tasa válida y aquí puedes corregirla a mano.":"Escribes la tasa del día y la guardas. Valor de prueba tomado de la tasa oficial del 21/09/2026."}</div>

   <div class="panel"><h2>Hero de la página de inicio</h2>

    <div class="note">Cada pedido usa el WhatsApp y el Pago Móvil de la sede que lo despacha.</div></div></div>`;
  return `<div class="list-head"><div><h1>Panel de la tienda</h1><div class="muted">${esc(EMPRESA.razon)} · RIF ${EMPRESA.rif}</div></div></div>
  <div class="tabs chips">${tabs.map(([k,l])=>`<button class="chip" data-tab="${k}" aria-pressed="${S.adminTab===k}">${l}${k==="pagos"&&q.length?` (${q.length})`:""}</button>`).join("")}</div>${body}`}

/* ---------- shell ---------- */
function render(){
  const root=document.documentElement;root.classList.toggle("notes",S.notes&&S.mode==="cliente");
  const n=S.cart.reduce((a,l)=>a+(P[l.id].unit==="kg"&&l.pres==null?1:l.qty),0);const t=cartTotals();
  const si=subInfo();
  let view={home:vHome,cats:vCats,list:vList,search:vSearch,promos:vPromos,checkout:vCheckout,orders:vOrders,order:vOrder,admin:vAdmin}[S.mode==="admin"?"admin":S.view]();
  const act=S.view;
  $("#app").innerHTML=`
  <div class="ribbon"><div class="wrap"><span>Prototipo<span class="hide-m"> · precios de la hoja de Google, sujetos a actualización</span></span>
   <div class="seg" role="group" aria-label="Vista"><button data-mode="cliente" aria-pressed="${S.mode==="cliente"}">Vista cliente</button><button data-mode="admin" aria-pressed="${S.mode==="admin"}">Panel tienda</button></div></div></div>
  ${S.mode==="cliente"?`<div class="service mod" data-mod="Editable"><div class="wrap">${svg(I.scale).replace('<svg','<svg style="width:18px;height:18px"')}<span>${SERVICE[S.svc]}</span></div></div>`:""}
  <header class="top"><div class="wrap">
   <button class="brand" data-go="home" aria-label="Pitapollo, ir al inicio"><img class="head" src="${HEAD}" alt=""><img class="word" src="${WORD}" alt="Pitapollo"></button>
   ${S.mode==="cliente"?`<div class="search">${svg(I.search,2)}<input id="q" type="search" placeholder="Busca pechuga, molida, queso blanco…" value="${esc(S.q)}" aria-label="Buscar productos"></div>
   <div class="hdr-actions"><button class="zone-btn" data-zone>${svg(I.pin,2)}<span>${si?esc(si.urb):"Elige tu zona"}</span></button>
    <button class="cart-btn" data-drawer aria-label="Carrito, ${n} productos">${svg(I.cart,2)}<span class="lbl">Tu carrito</span><span class="count num">${n}</span></button></div>`:`<div></div><div class="hdr-actions"><span class="pill red">Operador</span></div>`}
  </div>${S.mode==="cliente"?`<nav class="catnav" aria-label="Categorías"><div class="wrap">${CATS.map(c=>`<button data-cat="${c.id}" aria-current="${S.view==="list"&&S.cat===c.id}">${esc(c.short||c.name)}</button>`).join("")}<button data-go="promos" aria-current="${S.view==="promos"}">Promos</button></div></nav>`:""}</header>
  <main class="wrap">${view}</main>
  <footer><div class="wrap"><div class="fgrid">
   <div><img src="${LOGO}" alt="Pitapollo" style="width:120px;height:auto"><p class="muted" style="margin:10px 0 0">Pollo, carnes, charcutería y víveres a domicilio en Caracas.</p></div>
   <div><h4>Zonas de entrega</h4><ul>${ZONAS.map(z=>`<li>${z.name}</li>`).join("")}</ul></div>
   <div><h4>Nuestras sedes</h4><ul>${EMPRESA.sedes.map(s=>`<li>${s} · <a href="${waLink(s)}" target="_blank" rel="noopener" style="color:inherit">WhatsApp ${SEDE_INFO[s].waTxt}</a></li>`).join("")}</ul><p class="note" style="margin-top:6px">Sin retiro en tienda: todos los pedidos se entregan a domicilio.</p></div>
   <div><h4>Pagos y garantías</h4><ul><li>Pago Móvil · Transferencia</li><li>Zelle · Efectivo en divisas</li><li>Punto de venta al recibir</li><li>Balanzas certificadas por SENCAMER</li><li>Instagram ${EMPRESA.ig}</li></ul></div></div>
   <div class="legal"><span><b>${EMPRESA.razon}</b></span><span>RIF <b>${EMPRESA.rif}</b></span><span>Precios en USD con referencia en Bs a la tasa BCV del día (${nf2.format(S.tasa)} Bs/USD)</span></div></div></footer>
  ${S.mode==="cliente"?(curSede()?`<a class="wa" style="text-decoration:none" href="${waLink(curSede())}" target="_blank" rel="noopener" aria-label="WhatsApp ${esc(curSede())}">${svg(I.chat,2)}<span class="lbl">WhatsApp</span></a>`:`<button class="wa" data-wapick>${svg(I.chat,2)}<span class="lbl">WhatsApp</span></button>`)+`
  <nav class="bnav" aria-label="Navegación"><div class="row">
   ${[["home","Inicio",I.home],["cats","Categorías",I.grid],["search","Buscar",I.search],["orders","Mis pedidos",I.receipt]].map(([k,l,ic])=>`<button data-go="${k}" aria-current="${act===k||(k==="cats"&&act==="list")||(k==="orders"&&act==="order")}">${svg(ic,1.9)}${l}</button>`).join("")}
   <button data-drawer>${svg(I.cart,1.9)}Carrito${n?`<span class="dot num">${n}</span>`:""}</button></div></nav>`:""}
  ${S.sheet?vSheet():""}${S.drawer?vDrawer():""}${S.zonePick?vZone():""}${S.waPick?vWaPick():""}
  ${S.toast?`<div class="toast" role="status">${esc(S.toast)}</div>`:""}`;
  document.body.style.overflow=(S.sheet||S.drawer||S.zonePick)?"hidden":"";
}

/* ---------- actions ---------- */
function go(v){S.view=v;S.errors={};S.mode="cliente";window.scrollTo({top:0});render();if(v==="search")setTimeout(()=>{const q=$("#q");q&&q.focus()},0)}
function nowHM(add=0){const d=new Date(Date.now()+add*60000);return d.toLocaleTimeString("es-VE",{hour:"numeric",minute:"2-digit"})}
function finalize(o){let sub=0;o.lines.forEach(l=>{const p=P[l.id];l.sub=p.price*l.qty;l.w=null;sub+=l.sub});
 o.exact=Math.round(sub*100)/100;o.fee=o.feeBase;o.total=o.exact+o.fee;o.status="pesado";o.pesadoHora=nowHM();o.pagarAntes=nowHM(30)}
/* ---------- pesaje real ---------- */
const parseKg=v=>{v=String(v||"").trim();if(!v)return null;const n=v.includes(",")?parseFloat(v.replace(/\./g,"").replace(",",".")):parseFloat(v);return n>0?n:null};
function wCalc(l,w){const p=P[l.id],r=l.pres!=null?p.pres[l.pres]:null;const pk=r?r.price:p.price;const gk=r&&r.guar?r.guar*l.qty:0;
  const billed=w==null?null:Math.max(w,gk);const lo=r?r.min*l.qty:l.kg*.97,hi=r?r.max*l.qty:l.kg*1.03;
  return {pk,billed,gk,lo,hi,sub:billed==null?null:Math.round(billed*pk*100)/100}}
function wTotals(o){const dr=o.wDraft||{w:{}};let sub=0,miss=0;o.lines.forEach((l,i)=>{if(P[l.id].unit==="unidad")sub+=P[l.id].price*l.qty;else{const c=wCalc(l,parseKg(dr.w[i]));if(c.sub==null)miss++;else sub+=c.sub}});
  sub=Math.round(sub*100)/100;return {sub,miss,total:sub+o.feeBase}}
function updWeigh(o){const dr=o.wDraft;o.lines.forEach((l,i)=>{if(P[l.id].unit!=="kg")return;const w=parseKg(dr.w[i]);const c=wCalc(l,w);
   const e=document.getElementById("ws-"+i),m=document.getElementById("ww-"+i);if(e)e.textContent=c.sub==null?"—":usd(c.sub);
   if(m)m.innerHTML=w==null?"":(w<c.gk?"Mínimo garantizado: se cobra "+kg(c.gk)+". ":"")+((w<c.lo*.9||w>c.hi*1.1)?'<span class="wwarn">Fuera del rango estimado ('+kg(c.lo)+" a "+kg(c.hi)+"). Verifica el peso.</span>":"")});
  const t=wTotals(o),e=document.getElementById("w-tot");if(e)e.innerHTML=`<div><span>Productos</span><span>${usd(t.sub)}</span></div><div><span>Envío</span><span>${usd(o.feeBase)}</span></div><div class="tot"><span>Total exacto</span><span>${usd(t.total)}</span></div><div><span class="note">En bolívares</span><span class="note">${bs(t.total)}</span></div>`}
function vPesaje(o){const dr=o.wDraft||(o.wDraft={w:{},img:null});const t=wTotals(o);
  const rows=o.lines.map((l,i)=>[l,i]).filter(([l])=>P[l.id].unit==="kg").map(([l,i])=>{const p=P[l.id],c=wCalc(l,parseKg(dr.w[i]));
   return `<div class="wrow"><div><b>${esc(p.name)}</b><div class="meta num">${lineLabel(l)} · estimado ${kg(c.lo)} a ${kg(c.hi)}${c.gk?" · mínimo garantizado "+kg(c.gk):""}</div></div>
    <div><div class="win"><input data-wi="${i}" inputmode="decimal" autocomplete="off" aria-label="Peso real de ${esc(p.name)} en kilos" placeholder="0,000" value="${esc(dr.w[i]||"")}"><span class="muted">kg</span></div></div>
    <div class="sub num"><span id="ww-${i}" class="note"></span><span>${usd(c.pk)}/kg · <b style="display:inline" id="ws-${i}">${c.sub==null?"—":usd(c.sub)}</b></span></div></div>`}).join("");
  const unit=o.lines.filter(l=>P[l.id].unit==="unidad");
  return `<div class="panel" style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>Pesar pedido ${o.num}</h2><button class="x" data-weighcancel aria-label="Cerrar">${svg(I.x,2)}</button></div>
   <div class="note">Escribe el peso real que marca la balanza para cada producto. Cobramos el peso real, respetando el mínimo garantizado.</div>
   <div>${rows}</div>
   ${unit.length?`<div class="note">Por unidad, sin pesar: ${unit.map(l=>esc(P[l.id].name)+" × "+l.qty).join(", ")}.</div>`:""}
   <div><div class="label">Foto de la balanza</div>
    <label class="drop" for="w-file">${dr.img?`<img class="wphoto" src="${dr.img}" alt="Foto de la balanza">Cambiar foto`:`${svg(I.camera).replace('<svg','<svg style="width:28px;height:28px"')}<span><b>Toma o sube la foto de la balanza</b><br>Debe verse el peso en la pantalla</span>`}</label>
    <input id="w-file" type="file" accept="image/*" capture="environment" class="sr" data-num="${o.num}"></div>
   <div class="sum num" id="w-tot"><div><span>Productos</span><span>${usd(t.sub)}</span></div><div><span>Envío</span><span>${usd(o.feeBase)}</span></div><div class="tot"><span>Total exacto</span><span>${usd(t.total)}</span></div><div><span class="note">En bolívares</span><span class="note">${bs(t.total)}</span></div></div>
   <button class="btn btn-primary btn-block" data-weighok="${o.num}">Confirmar pesaje y avisar al cliente</button>
   <div class="note">El cliente verá la foto y los pesos en su pedido, y tendrá 30 minutos para pagar.</div></div>`}
function waCliente(o){let d=(o.tel||"").replace(/\D/g,"");if(d.startsWith("0"))d="58"+d.slice(1);
  const L=o.lines.map(l=>P[l.id].name+": "+(l.w!=null?kg(l.w)+" = "+usd(l.sub):usd(l.sub))).join("\n");
  const m=METODOS.find(x=>x.id===o.metodo);
  const txt=`Hola ${o.nom}, te escribe Pitapollo ${(o.sede||"").replace("Sede ","")}. Pesamos tu pedido ${o.num}:\n${L}\nEnvío: ${usd(o.fee)}\nTotal exacto: ${usd(o.total)} (${bs(o.total)}, tasa BCV ${nf2.format(S.tasa)}).\nTienes hasta las ${o.pagarAntes} para pagar${m?" por "+m.name:""}. Te adjunto la foto de la balanza.`;
  return `https://wa.me/${d}?text=${encodeURIComponent(txt)}`}
document.addEventListener("click",e=>{
  const el=e.target.closest("button,[data-close],label.drop");if(!el)return;const d=el.dataset;
  if(d.close&&e.target.closest("[data-stop]")&&!e.target.closest("button[data-close]"))return;
  if(d.close){S[d.close==="zone"?"zonePick":d.close]=d.close==="sheet"?null:false; if(!d.go){render();return}}
  if(d.mode){S.mode=d.mode;window.scrollTo({top:0});render();return}
  if(d.go){go(d.go);return}
  if(d.cat){S.cat=d.cat;S.filter="all";go("list");return}
  if(d.filter){S.filter=d.filter;render();return}
  if(d.q){S.q=d.q;go("search");return}
  if(d.open){openSheet(d.open);return}
  if(d.quick){addLine({id:d.quick,pres:null,qty:1,kg:1,note:"",sust:"similar"});toast(`${P[d.quick].name} agregado al carrito`);return}
  if(d.pres!=null){S.sel.pres=+d.pres;render();return}
  if(d.qty){S.sel.qty=Math.max(1,S.sel.qty+ +d.qty);render();return}
  if(d.kg){S.sel.kg=+d.kg;render();return}
  if("addsel" in d){const s=S.sel;addLine({id:S.sheet,pres:s.pres,qty:s.qty,kg:s.kg,note:s.note,sust:s.sust});const nm=P[S.sheet].name;S.sheet=null;toast(`${nm} agregado al carrito`);return}
  if("drawer" in d){S.drawer=true;S.view=S.view==="checkout"?"checkout":S.view;render();return}
  if(d.rm!=null){S.cart.splice(+d.rm,1);render();return}
  if("zone" in d){S.zonePick=true;render();return}
  if(d.sub){S.sub=d.sub;S.zonePick=false;toast(`Entregas en ${d.sub.split("|")[1]}`);return}
  if(d.day!=null){S.co.day=+d.day;keepForm();render();return}
  if(d.slot){S.co.slot=d.slot;keepForm();render();return}
  if(d.order){S.order=d.order;go("order");return}
  if(d.weighcancel!=null){S.weighing=null;render();return}
  if(d.weighok){const o=S.orders.find(x=>x.num===d.weighok),dr=o.wDraft||(o.wDraft={w:{},img:null});
    const miss=o.lines.filter((l,i)=>P[l.id].unit==="kg"&&!parseKg(dr.w[i]));
    if(miss.length){toast("Falta el peso de "+P[miss[0].id].name);return}
    if(!dr.img){toast("Falta la foto de la balanza");return}
    let sub=0;o.lines.forEach((l,i)=>{const p=P[l.id];if(p.unit==="unidad"){l.sub=p.price*l.qty;l.w=null}else{const w=parseKg(dr.w[i]),c=wCalc(l,w);l.wReal=w;l.w=c.billed;l.pk=c.pk;l.sub=c.sub}sub+=l.sub});
    o.exact=Math.round(sub*100)/100;o.fee=o.feeBase;o.total=o.exact+o.fee;o.scalePhoto=dr.img;o.status="pesado";o.pesadoHora=nowHM();o.pagarAntes=nowHM(30);
    S.weighing=null;S.adminOrder=o.num;render();toast("Pesaje guardado. Avisa al cliente por WhatsApp");return}
  if(d.demo){const o=S.orders.find(x=>x.num===d.num);
    if(d.demo==="weigh"){S.mode="admin";S.adminTab="pedidos";S.weighing=o.num;S.adminOrder=null;window.scrollTo({top:0})}
    if(d.demo==="panel"){S.mode="admin";S.adminTab="pagos";window.scrollTo({top:0})}
    if(d.demo==="ship"){o.status="camino";toast("Motorizado asignado")}
    if(d.demo==="deliver"){o.status="entregado";toast("Pedido entregado")}
    render();return}
  if(d.paymethod){const o=S.orders.find(x=>x.num===d.num);o.metodo=d.paymethod;render();return}
  if(d.copy){const v=d.copy;const done=()=>toast("Copiado: "+v);try{navigator.clipboard.writeText(v).then(done,()=>toast("Selecciona el texto para copiarlo"))}catch(_){toast("Selecciona el texto para copiarlo")}return}
  if(d.contra){const o=S.orders.find(x=>x.num===d.contra);o.pago={contra:true};o.status="confirmado";toast("Listo: pagarás al recibir");render();return}
  if(d.approve){const o=S.orders.find(x=>x.num===d.approve);o.status="confirmado";o.rechazo=null;toast(`Pago de ${o.num} aprobado`);return}
  if(d.reject){const o=S.orders.find(x=>x.num===d.reject);const m=$("#mot-"+d.reject).value;o.status="pesado";o.rechazo=m;o.payDraft={};toast(`Pago de ${o.num} rechazado`);return}
  if("wapick" in d){S.waPick=true;render();return}
  if(d.tab){S.adminTab=d.tab;S.mode="admin";render();return}
  if(d.sedef){S.sedeF=d.sedef;render();return}
  if(d.verped!=null){S.adminOrder=d.verped||null;render();return}
  if(d.tasamode){S.tasaAuto=d.tasamode==="auto";render();toast(S.tasaAuto?"Actualización automática activada":"Actualización manual");return}
  if("tasasim" in d){S.tasaFecha=new Date().toLocaleDateString("es-VE");S.tasaHora=nowHM();S.tasaFuente="auto";render();toast("Simulación: tasa tomada del BCV a las "+S.tasaHora);return}
  if("savetasa" in d){const v=parseFloat($("#a-tasa").value.replace(/\./g,"").replace(",","."));if(v>0){S.tasa=v;S.tasaFecha=new Date().toLocaleDateString("es-VE");S.tasaHora=nowHM();S.tasaFuente="manual";render();toast("Tasa actualizada")}else toast("Escribe una tasa válida, por ejemplo 849,56");return}
  if("savehero" in d){S.hero={title:$("#a-ht").value.trim()||S.hero.title,sub:$("#a-hs").value.trim()||S.hero.sub};toast("Hero publicado. Revísalo en la vista cliente");return}
  if(d.repeat){const o=S.orders.find(x=>x.num===d.repeat);o.lines.forEach(l=>addLine({id:l.id,pres:l.pres,qty:l.qty,kg:l.kg,note:l.note,sust:l.sust}));S.drawer=true;render();return}
  if(d.toast){toast(d.toast);return}
});
function keepForm(){const f=$("#coForm");if(!f)return;const fd=new FormData(f);["dir","ref","nom","tel","mail","recibe","metodo"].forEach(k=>{if(fd.has(k))S.co[k]=fd.get(k)});if(fd.get("sub"))S.sub=fd.get("sub")}
document.addEventListener("input",e=>{const t=e.target;
  if(t.dataset.wi!=null){const o=S.orders.find(x=>x.num===S.weighing);if(o){o.wDraft.w[t.dataset.wi]=t.value;updWeigh(o)}return}
  if(t.id==="q"){S.q=t.value;if(S.view!=="search"){S.view="search";render();const q=$("#q");q.focus();q.setSelectionRange(q.value.length,q.value.length)}else{const pos=t.selectionStart;render();const q=$("#q");q.focus();q.setSelectionRange(pos,pos)}return}
  if(t.dataset.sel){S.sel[t.dataset.sel]=t.value;if(t.tagName==="SELECT")render();return}
  if(t.id==="a-notes"){S.notes=t.checked;return}
  if(t.closest("#coForm")&&t.name){if(t.name==="sub")S.sub=t.value||null;else S.co[t.name]=t.value;return}
  const pf=t.closest("#payForm");if(pf){const o=S.orders.find(x=>x.num===pf.dataset.num);o.payDraft[t.name]=t.value}
});
document.addEventListener("change",e=>{const t=e.target;
  if(t.id==="w-file"&&t.files[0]){const o=S.orders.find(x=>x.num===t.dataset.num);const r=new FileReader();
    r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas");const k=Math.min(1,1100/Math.max(img.width,img.height));c.width=img.width*k;c.height=img.height*k;c.getContext("2d").drawImage(img,0,0,c.width,c.height);o.wDraft.img=c.toDataURL("image/jpeg",.75);render();updWeigh(o)};img.src=r.result};r.readAsDataURL(t.files[0]);return}
  if(t.id==="f-sub"){keepForm();render();return}
  if(t.name==="metodo"){S.co.metodo=t.value}
  if(t.dataset.pres!=null){S.sel.pres=+t.dataset.pres;render();return}
  if(t.id==="p-file"&&t.files[0]){const o=S.orders.find(x=>x.num===t.dataset.num);const r=new FileReader();
    r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas");const s=Math.min(1,900/Math.max(img.width,img.height));c.width=img.width*s;c.height=img.height*s;c.getContext("2d").drawImage(img,0,0,c.width,c.height);o.payDraft.img=c.toDataURL("image/jpeg",.7);render()};img.src=r.result};r.readAsDataURL(t.files[0])}
});
document.addEventListener("submit",e=>{e.preventDefault();
  if(e.target.id==="coForm"){keepForm();const c=S.co,E={};
    if(!S.sub)E.sub="Elige tu urbanización";if(!(c.dir||"").trim())E.dir="Escribe tu dirección";if(!c.slot)E.slot="Elige una franja de entrega";
    if(!(c.nom||"").trim())E.nom="Escribe tu nombre";if(!/^\+?[\d\s-]{10,15}$/.test((c.tel||"").trim()))E.tel="Escribe un teléfono válido, por ejemplo 0412 123 4567";
    S.errors=E;if(Object.keys(E).length){render();toast("Revisa los campos marcados");return}
    const t=cartTotals();const si=subInfo();const num="PP-"+String(1024+S.orders.length+1).padStart(6,"0");
    const o={num,lines:S.cart.map(l=>({...l,e:lineEst(l)})),est:t,feeBase:si.zona.fee,fee:si.zona.fee,zona:si.zona.name,urb:si.urb,sede:si.zona.sede,dir:(c.dir||"").trim(),ref:(c.ref||"").trim(),mail:(c.mail||"").trim(),recibe:c.recibe,
      dayLbl:"Hoy",slot:c.slot,nom:c.nom.trim(),tel:c.tel.trim(),metodo:c.metodo,status:"recibido",exact:null};
    if(o.lines.every(l=>P[l.id].unit==="unidad"))finalize(o);
    S.orders.unshift(o);S.cart=[];S.order=num;S.co={day:0,slot:null,metodo:"pm",recibe:"yo"};go("order");toast(`Pedido ${num} confirmado`);return}
  if(e.target.id==="payForm"){const o=S.orders.find(x=>x.num===e.target.dataset.num);const p=o.payDraft;
    if(!(p.ref||"").trim()){S.errors={ref:"Escribe la referencia del pago"};render();return}
    S.errors={};o.pago={ref:p.ref.trim(),banco:(p.banco||"").trim(),img:p.img||null,hora:nowHM()};o.status="revision";window.scrollTo({top:0});toast("Comprobante enviado");render()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&(S.sheet||S.drawer||S.zonePick)){S.sheet=null;S.drawer=false;S.zonePick=false;render()}});
setInterval(()=>{if(S.mode==="cliente"&&!S.sheet&&!S.drawer&&!S.zonePick&&document.activeElement.tagName!=="INPUT"&&document.activeElement.tagName!=="TEXTAREA"&&document.activeElement.tagName!=="SELECT"){S.svc=(S.svc+1)%SERVICE.length;const el=document.querySelector(".service span");if(el)el.textContent=SERVICE[S.svc]}},4500);
render();
</script>

</body></html>
